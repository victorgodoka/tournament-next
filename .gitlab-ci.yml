image: docker:20.10.6-dind

services:
  - docker:20.10.6-dind

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2

stages:
  - build
  - deploy

build:
  stage: build
  tags:
    - runner
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    # Builds run on the runner host's daemon, which keeps every image and layer until its disk fills.
    # ponytail: the 3 GB cap is a guess at one build's cache (recent layers survive); adjust from the df output below.
    - docker images "$CI_REGISTRY_IMAGE" --format '{{.Repository}}:{{.Tag}}' | xargs -r docker rmi || true
    - docker builder prune -af --keep-storage 3GB
    - df -h / && df -i / && docker system df
  script:
    - |
      docker build \
        --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
        --build-arg NEXT_PUBLIC_DISCORD_URL="$NEXT_PUBLIC_DISCORD_URL" \
        --build-arg NEXT_PUBLIC_UPLOADS_URL="$NEXT_PUBLIC_UPLOADS_URL" \
        -t "$CI_REGISTRY_IMAGE:latest" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        .
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
